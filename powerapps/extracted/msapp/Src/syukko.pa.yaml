            - BarcodeReader3_1:
                Control: BarcodeReader@1.0.25
                Properties:
                  OnScan: |-
                    =UpdateContext({ItemNum: First(Self.Barcodes).Value});
                    UpdateContext(
                        {
                            CurrentNumOfItem_O: LookUp(
                                pms_備品管理,
                                部品品番 = ItemNum
                            ).'部品数（事務所）',
                            CurrentNumOfItem_C: LookUp(
                                pms_備品管理,
                                部品品番 = ItemNum
                            ).'部品数（車載）'
                        }
                    )
            - Form5_1:
                Control: Form@2.4.4
                Variant: Classic
                Layout: Vertical
                Properties:
                  BorderColor: =RGBA(245, 245, 245, 1)
                  DataSource: ='pms_出庫管理'
                  DefaultMode: =FormMode.New
                  OnFailure: =Notify("登録できませんでした。:" & Form5_1.Error,NotificationType.Error)
                  OnSuccess: |-
                    =Notify("登録しました",NotificationType.Success);
                    UpdateContext({ItemNum: ""});
                    NewForm(Form5_1);
                Children:
                  - title_DataCard1:
                      Control: TypedDataCard@1.0.7
                      Variant: ClassicTextualEdit

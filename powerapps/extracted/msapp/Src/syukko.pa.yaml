                  - Button11_1:
                      Control: Classic/Button@2.2.0
                      Properties:
                        BorderColor: =RGBA(0, 0, 0, 0)
                        BorderStyle: =BorderStyle.None
                        Color: =RGBA(255, 255, 255, 1)
                        DisabledBorderColor: =RGBA(0, 0, 0, 0)
                        DisabledColor: =RGBA(161, 159, 157, 1)
                        DisabledFill: =RGBA(242, 242, 241, 0)
                        Fill: =RGBA(0, 120, 212, 1)
                        Font: =Font.'Segoe UI'
                        HoverBorderColor: =RGBA(0, 0, 0, 0)
                        HoverColor: =RGBA(255, 255, 255, 1)
                        HoverFill: =RGBA(16, 110, 190, 1)
                        OnSelect: |-
                          =UpdateContext(
                              {
                                  ItemNum: DataCardValue1.Text,
                                  ItemName: DataCardValue3.Text,
                                  CurrentStrgLocation: Radio4.Selected.Value,
                                  CurrentStrgLocationDetail: ComboBox4.Selected.Value,
                                  UseCheck: Radio1.Selected.Value,
                                  BillCategory: Radio2.Selected.Value,
                                  NextStrgLocation: Radio3.Selected.Value,
                                  NumOfSyukkoItem: Value(DataCardValue4.Text),
                                  NextNumOfItem_O: 0,
                                  NextNumOfItem_C: 0
                              }
                          );
                          With(
                              {FlagComb5: ComboBox5.Selected},
                              If(
                                  IsBlank(FlagComb5),
                                  UpdateContext({NextStrgLocationDetail: ComboBox5.SearchText}),
                                  UpdateContext({NextStrgLocationDetail: FlagComb5.Value})
                              )
                          );
                          If(
                              UseCheck = "未使用" && CurrentStrgLocation = "事務所" && NextStrgLocation = "事務所",
                              UpdateContext(
                                  {
                                      NextNumOfItem_O: CurrentNumOfItem_O,
                                      NextNumOfItem_C: CurrentNumOfItem_C
                                  }
                              )
                          );
                          If(
                              UseCheck = "未使用" && CurrentStrgLocation = "事務所" && NextStrgLocation = "車載",
                              UpdateContext(
                                  {
                                      NextNumOfItem_O: CurrentNumOfItem_O - NumOfSyukkoItem,
                                      NextNumOfItem_C: CurrentNumOfItem_C + NumOfSyukkoItem
                                  }
                              )
                          );
                          If(
                              UseCheck = "未使用" && CurrentStrgLocation = "車載" && NextStrgLocation = "事務所",
                              UpdateContext(
                                  {
                                      NextNumOfItem_O: CurrentNumOfItem_O + NumOfSyukkoItem,
                                      NextNumOfItem_C: CurrentNumOfItem_C - NumOfSyukkoItem
                                  }
                              )
                          );
                          If(
                              UseCheck = "未使用" && CurrentStrgLocation = "車載" && NextStrgLocation = "車載",
                              UpdateContext(
                                  {
                                      NextNumOfItem_O: CurrentNumOfItem_O,
                                      NextNumOfItem_C: CurrentNumOfItem_C
                                  }
                              )
                          );
                          If(
                              UseCheck = "使用済" && CurrentStrgLocation = "事務所",
                              UpdateContext(
                                  {
                                      NextNumOfItem_O: CurrentNumOfItem_O - NumOfSyukkoItem,
                                      NextNumOfItem_C: CurrentNumOfItem_C
                                  }
                              )
                          );
                          If(
                              UseCheck = "使用済" && CurrentStrgLocation = "車載",
                              UpdateContext(
                                  {
                                      NextNumOfItem_O: CurrentNumOfItem_O,
                                      NextNumOfItem_C: CurrentNumOfItem_C - NumOfSyukkoItem
                                  }
                              )
                          );
                          //備品リストの更新
                          Patch(
                              pms_備品管理,
                              LookUp(
                                  pms_備品管理,
                                  部品品番 = ItemNum
                              ),
                              {
                                  '部品数（事務所）': NextNumOfItem_O,
                                  '部品数（車載）': NextNumOfItem_C
                              }
                          );
                          //車載リストの更新
                          UpdateContext(
                              {
                                  CurrentCarRec: LookUp(
                                      pms_車載部品,
                                      部品品番 = ItemNum && '保管場所（車載）' = CurrentStrgLocationDetail
                                  ),
                                  NewCarRec: LookUp(
                                      pms_車載部品,
                                      部品品番 = ItemNum && '保管場所（車載）' = NextStrgLocationDetail
                                  )
                              }
                          );
                          If(
                              CurrentStrgLocation = "車載",
                              If(
                                  CurrentStrgLocationDetail <> NextStrgLocationDetail,
                                  Patch(
                                      pms_車載部品,
                                      CurrentCarRec,
                                      {部品数: CurrentCarRec.部品数 - NumOfSyukkoItem}
                                  )
                              )
                          );
                          If(
                              NextStrgLocation = "車載",
                              If(
                                  IsBlank(NewCarRec),
                                  Patch(
                                      pms_車載部品,
                                      Defaults(pms_車載部品),
                                      {
                                          部品品番: ItemNum,
                                          '保管場所（車載）': NextStrgLocationDetail,
                                          部品名称: ItemName,
                                          部品数: NumOfSyukkoItem
                                      }
                                  ),
                                  If(
                                      CurrentStrgLocationDetail <> NextStrgLocationDetail,
                                      Patch(
                                          pms_車載部品,
                                          NewCarRec,
                                          {部品数: NewCarRec.部品数 + NumOfSyukkoItem}
                                      )
                                  )
                              )
                          );
                          SubmitForm(Form5_1)
                        PressedBorderColor: =RGBA(0, 69, 120, 1)
                        PressedColor: =RGBA(255, 255, 255, 1)
                        PressedFill: =RGBA(16, 110, 190, 1)
                        RadiusBottomLeft: =0
                        RadiusBottomRight: =0
                        RadiusTopLeft: =0
                        RadiusTopRight: =0
                        Text: ="登録"
                        Width: =250
